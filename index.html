<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>itouCards</title>
<meta name="description" content="itouSouta的名片們 ( ˘•ω•˘ ) " />
<link rel="icon" href="favicon.ico" type="image/x-icon" />
<link rel="stylesheet" href="style.css?v=2" />
</head>
<body>

<div class="noise" aria-hidden="true"></div>

<main class="stage" id="stage">
  <div class="pedestal" aria-hidden="true"></div>

  <div class="card-rig" id="cardRig">
    <div
      class="card-flip"
      id="cardFlip"
      tabindex="0"
      role="button"
    >
      <div class="card-face card-face--front" id="faceFront">
        <span class="sheen" aria-hidden="true"></span>
      </div>
      <div class="card-face card-face--back" id="faceBack" aria-hidden="true"></div>
    </div>
  </div>

  <div id="srStatus" class="sr-only" role="status" aria-live="polite"></div>
</main>

<nav class="deck-tabs" role="tablist" aria-label="名片集">
  <button class="deck-tab is-active" role="tab" aria-selected="true"
    data-deck="scaict" id="tab-scaict" tabindex="0">SCAICT</button>
  <button class="deck-tab" role="tab" aria-selected="false"
    data-deck="personal" id="tab-personal" tabindex="-1">Personal</button>
</nav>

<script type="module" src="app.js?v=2"></script>
</body>
</html>
